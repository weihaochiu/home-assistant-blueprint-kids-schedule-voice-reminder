name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check YAML style
        run: python -m yamllint .
      - name: Validate Home Assistant selector schema
        run: python scripts/validate_ha_selector_schema.py
      - name: Run Blueprint and logic tests
        run: python -m pytest -q
      - name: Check whitespace errors
        run: git diff --check $(git hash-object -t tree /dev/null) HEAD
