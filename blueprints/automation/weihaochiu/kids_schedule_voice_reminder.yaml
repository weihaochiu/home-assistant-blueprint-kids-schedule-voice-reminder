blueprint:
  name: Kids Schedule Voice Reminder（小孩行程與接送語音提醒）· v0.3.3
  description: >-
    版本：v0.3.3。最低 Home Assistant：2026.1.0。以動態 Children／群組、Events、
    時段與提醒管理行程；可選 Calendar、Workday 或舊 helper 判斷活動發生日是否放假，
    並相容 v0.2 與 v0.1 Events。
  domain: automation
  author: weihaochiu
  source_url: >-
    https://github.com/weihaochiu/home-assistant-blueprint-kids-schedule-voice-reminder/blob/main/blueprints/automation/weihaochiu/kids_schedule_voice_reminder.yaml
  homeassistant:
    min_version: 2026.1.0
  input:
    holiday_section:
      name: 📅 假日來源／活動日政策
      icon: mdi:calendar-check
      description: >-
        查詢活動發生日（不是播報日）。三種來源互斥；查詢失敗、實體不可用或回傳缺漏時
        採 fail-open。新安裝建議 Calendar；升級預設 Workday 以保持 v0.2 行為。
      input:
        holiday_source:
          name: 假日來源
          description: Calendar、Workday 與 Legacy 只會執行選定的一種。
          default: workday
          selector:
            select:
              custom_value: false
              mode: dropdown
              options:
                - {label: Calendar（新安裝建議）, value: calendar}
                - {label: Workday（v0.2 升級預設）, value: workday}
                - {label: Legacy helper（v0.1 相容）, value: legacy}
        holiday_calendar_entity:
          name: 假日日曆實體（Calendar 模式）
          description: >-
            建議使用 Remote Calendar 匯入 Google 台灣假日日曆。只依事件內容分類；
            日曆內有事件不代表一定放假。非 Calendar 模式不會查詢。
          default: ""
          selector:
            entity:
              filter:
                - domain: calendar
        workday_entity:
          name: Workday 實體（Workday 模式）
          description: >-
            Workday 模式使用；留空且舊補假 helper 有設定時，會保留 v0.2 的相容橋接。
          default: ""
          selector:
            entity:
              filter:
                - integration: workday
                  domain: binary_sensor
    playback_section:
      name: 🔊 TTS 與播放器
      icon: mdi:account-voice
      input:
        media_players:
          name: 播放器
          selector:
            entity:
              multiple: true
              filter: [{domain: media_player}]
        tts_entity:
          name: TTS 實體
          selector:
            entity:
              filter: [{domain: tts}]
        tts_language:
          name: TTS 語言
          default: zh-tw
          selector: {text: null}
        announcement_volume:
          name: 播報音量
          default: 0.75
          selector:
            number: {min: 0, max: 1, step: 0.05, mode: slider}
        restore_original_volume:
          name: 恢復各播放器原音量
          default: true
          selector: {boolean: null}
        attempt_media_resume:
          name: 嘗試恢復原本媒體
          description: 傳送 announce；實際能力取決於播放器與整合。
          default: false
          selector: {boolean: null}
    children_section:
      name: 👧 Children／群組與 Events
      icon: mdi:account-group
      description: >-
        刪除 Child 會刪除其子樹；停用 Child 會停用其子樹。Object selector 沒有拖曳重排，
        播放順序依 Child、Event、Reminder 的畫面／YAML 輸入順序。
      input:
        children:
          name: Children／群組
          description: 有至少一個具名稱項目時只使用此處；共同行程可建群組。
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              description_field: spoken_name
              fields:
                name: &required_text
                  label: 孩子／群組名稱
                  required: true
                  selector: {text: null}
                enabled: &required_enabled
                  label: 啟用
                  required: true
                  selector: {boolean: null}
                spoken_name:
                  label: 播報稱呼（選填；預設使用名稱）
                  selector: {text: null}
                events:
                  label: Events
                  required: true
                  selector:
                    object: &event_object
                      multiple: true
                      label_field: name
                      description_field: location
                      fields:
                        name:
                          label: 事件名稱
                          required: true
                          selector: {text: null}
                        enabled: *required_enabled
                        location:
                          label: 地點（選填）
                          selector: {text: null}
                        non_workday_behavior:
                          label: 非工作日政策
                          required: true
                          selector:
                            select:
                              custom_value: false
                              mode: dropdown
                              options:
                                - {label: 非工作日停用, value: skip}
                                - {label: 非工作日仍照常, value: run}
                        schedules:
                          label: 上課／活動時段
                          required: true
                          selector: &schedules_selector
                            object:
                              multiple: true
                              label_field: start_time
                              description_field: end_time
                              fields:
                                weekdays:
                                  label: 星期
                                  required: true
                                  selector:
                                    select:
                                      multiple: true
                                      custom_value: false
                                      mode: dropdown
                                      options:
                                        - {label: 星期一, value: monday}
                                        - {label: 星期二, value: tuesday}
                                        - {label: 星期三, value: wednesday}
                                        - {label: 星期四, value: thursday}
                                        - {label: 星期五, value: friday}
                                        - {label: 星期六, value: saturday}
                                        - {label: 星期日, value: sunday}
                                start_time:
                                  label: 開始時間
                                  required: true
                                  selector: {time: null}
                                end_time:
                                  label: 結束時間
                                  required: true
                                  selector: {time: null}
                        reminders:
                          label: 提醒
                          selector: &reminders_selector
                            object:
                              multiple: true
                              label_field: name
                              description_field: timing
                              fields:
                                name:
                                  label: 提醒名稱
                                  required: true
                                  selector: {text: null}
                                enabled: *required_enabled
                                timing:
                                  label: 提醒時間
                                  required: true
                                  selector:
                                    choose:
                                      choices:
                                        前一天固定時間: &fixed_choice
                                          selector: {time: null}
                                        當天固定時間: *fixed_choice
                                        活動／上課前: &minutes_choice
                                          selector:
                                            number: {min: 1, max: 1440, step: 1, mode: box}
                                        下課前: *minutes_choice
                                        下課後: *minutes_choice
                                messages:
                                  label: 播報內容（可多句隨機；支援變數）
                                  selector:
                                    object:
                                      multiple: true
                                      label_field: message
                                      fields:
                                        message:
                                          label: 訊息
                                          required: true
                                          selector:
                                            text: {multiline: true}
    legacy_section:
      name: ⚠️ v0.1 相容性／舊 Events
      icon: mdi:history
      collapsed: true
      description: Children 沒有具名稱項目時才使用；新安裝請勿使用。
      input:
        makeup_holiday_entity:
          name: 舊補假開關（相容橋接）
          description: >-
            Legacy 模式使用；另保留 v0.2「Workday 留空」的升級橋接。unknown／unavailable 視為 off。
          default: ""
          selector:
            entity:
              filter: [{domain: input_boolean}]
        events:
          name: 舊 Events
          default: []
          selector:
            object:
              multiple: true
              label_field: name
              description_field: participant
              fields:
                name:
                  label: 事件名稱
                  required: true
                  selector: {text: null}
                enabled: *required_enabled
                participant:
                  label: 對象／孩子
                  selector: {text: null}
                location:
                  label: 地點
                  selector: {text: null}
                makeup_holiday_behavior:
                  label: 舊補假政策
                  required: true
                  selector:
                    select:
                      options:
                        - {label: 補假時停用, value: skip}
                        - {label: 補假仍照常, value: run}
                schedules:
                  label: 上課／活動時段
                  required: true
                  selector: *schedules_selector
                reminders:
                  label: 提醒
                  selector: *reminders_selector
    advanced_section:
      name: ⚙️ 進階設定
      icon: mdi:cog
      collapsed: true
      input:
        minimum_tts_wait:
          name: 每句最短等待秒數
          default: 8
          selector:
            number: {min: 1, max: 60, step: 1, mode: box}
        maximum_tts_wait:
          name: 每句最長等待秒數
          default: 120
          selector:
            number: {min: 10, max: 300, step: 1, mode: box}
        buffering_timeout:
          name: Buffering 額外等待秒數
          default: 10
          selector:
            number: {min: 0, max: 60, step: 1, mode: box}

mode: queued
max: 20
max_exceeded: warning
triggers:
  - {trigger: time_pattern, minutes: /1, id: heartbeat}

variables:
  holiday_source_input: !input holiday_source
  holiday_calendar_entity_input: !input holiday_calendar_entity
  workday_entity_input: !input workday_entity
  makeup_holiday_entity_input: !input makeup_holiday_entity
  media_players_input: !input media_players
  tts_entity_input: !input tts_entity
  tts_language_input: !input tts_language
  announcement_volume_input: !input announcement_volume
  restore_original_volume_input: !input restore_original_volume
  attempt_media_resume_input: !input attempt_media_resume
  children_input: !input children
  events_input: !input events
  minimum_tts_wait_input: !input minimum_tts_wait
  maximum_tts_wait_input: !input maximum_tts_wait
  buffering_timeout_input: !input buffering_timeout
  validated_minimum_tts_wait: >-
    {%- set value = minimum_tts_wait_input -%}
    {{ value | int if value is number and value is not boolean
      and value == value | int and 1 <= value <= 60 else 8 }}
  validated_maximum_tts_wait: >-
    {%- set value = maximum_tts_wait_input -%}
    {{ value | int if value is number and value is not boolean
      and value == value | int and 10 <= value <= 300 else 120 }}
  effective_minimum_tts_wait: >-
    {{ [validated_minimum_tts_wait | int(8), validated_maximum_tts_wait | int(120)] | min }}
  effective_maximum_tts_wait: >-
    {{ [validated_minimum_tts_wait | int(8), validated_maximum_tts_wait | int(120)] | max }}
  effective_buffering_timeout: >-
    {%- set value = buffering_timeout_input -%}
    {{ value | int if value is number and value is not boolean
      and value == value | int and 0 <= value <= 60 else 10 }}
  check_time: "{{ as_timestamp(trigger.now if trigger is defined and trigger.now is defined else now()) }}"
  check_minute: "{{ ((check_time | float(0)) // 60 * 60) | int }}"
  weekday_names: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
  valid_children: >-
    {%- set source = children_input if children_input is iterable and children_input is not string
      and children_input is not mapping else [] -%}
    {%- set ns = namespace(items=[]) -%}
    {%- for child in source if child is mapping -%}
      {%- if child.get('name', '') | string | trim | length > 0 -%}
        {%- set ns.items = ns.items + [child] -%}
      {%- endif -%}
    {%- endfor -%}{{- ns.items -}}
  runtime_events: >-
    {%- set ns = namespace(items=[]) -%}
    {%- if valid_children | count > 0 -%}
      {%- for child in valid_children -%}
        {%- set ci = loop.index0 -%}
        {%- set spoken = child.get('spoken_name', '') | string | trim -%}
        {%- set participant = spoken if spoken else child.get('name', '') | string | trim -%}
        {%- set source = child.get('events', []) -%}
        {%- set source = source if source is iterable and source is not string and source is not mapping else [] -%}
        {%- for event in source if event is mapping -%}
          {%- set ei = loop.index0 -%}
          {%- set ns.items = ns.items + [dict(event, participant=participant,
            child_name=child.get('name', '') | string | trim,
            child_enabled=child.get('enabled', true) | bool, child_order=ci, event_order=ei,
            runtime_id='child|' ~ ci ~ '|' ~ ei,
            non_workday_behavior=event.get('non_workday_behavior', 'skip'))] -%}
        {%- endfor -%}
      {%- endfor -%}
    {%- else -%}
      {%- set source = events_input if events_input is iterable and events_input is not string
        and events_input is not mapping else [] -%}
      {%- for event in source if event is mapping -%}
        {%- set ei = loop.index0 -%}
        {%- set ns.items = ns.items + [dict(event,
          participant=event.get('participant', '') | string | trim, child_enabled=true,
          child_name=event.get('participant', '') | string | trim,
          child_order=0, event_order=ei, runtime_id='legacy|' ~ ei,
          non_workday_behavior=event.get('makeup_holiday_behavior', 'skip'))] -%}
      {%- endfor -%}
    {%- endif -%}{{- ns.items -}}
  raw_candidates: >-
    {%- set check_dt = as_local(as_datetime(check_minute | int)) -%}
    {%- set day_start = check_dt.replace(hour=0, minute=0, second=0, microsecond=0) -%}
    {%- set ns = namespace(items=[], keys=[]) -%}
    {%- for event in runtime_events if event is mapping -%}
      {%- set name = event.get('name', '') | string | trim -%}
      {%- set schedules = event.get('schedules', []) -%}
      {%- set reminders = event.get('reminders', []) -%}
      {%- if event.get('child_enabled', true) | bool and event.get('enabled', true) | bool and name
        and schedules is iterable and schedules is not string and schedules is not mapping
        and reminders is iterable and reminders is not string and reminders is not mapping -%}
        {%- for schedule in schedules if schedule is mapping -%}
          {%- set weekdays = schedule.get('weekdays', []) -%}
          {%- set weekdays = [weekdays] if weekdays is string else weekdays -%}
          {%- set sp = (schedule.get('start_time', '') | string).split(':') -%}
          {%- set ep = (schedule.get('end_time', '') | string).split(':') -%}
          {%- set sh = sp[0] | int(-1) if sp | count >= 2 else -1 -%}
          {%- set sm = sp[1] | int(-1) if sp | count >= 2 else -1 -%}
          {%- set ss = sp[2] | int(-1) if sp | count >= 3 else 0 -%}
          {%- set eh = ep[0] | int(-1) if ep | count >= 2 else -1 -%}
          {%- set em = ep[1] | int(-1) if ep | count >= 2 else -1 -%}
          {%- set es = ep[2] | int(-1) if ep | count >= 3 else 0 -%}
          {%- set valid = 0 <= sh <= 23 and 0 <= sm <= 59 and 0 <= ss <= 59
            and 0 <= eh <= 23 and 0 <= em <= 59 and 0 <= es <= 59 -%}
          {%- if valid and weekdays is iterable and weekdays is not mapping -%}
            {%- for reminder in reminders if reminder is mapping -%}
              {%- set ri = loop.index0 -%}
              {%- set timing = reminder.get('timing', {}) -%}
              {%- if reminder.get('enabled', true) | bool and timing is mapping -%}
                {%- set kind = timing.get('active_choice', '') | string -%}
                {%- for offset in [-2, -1, 0, 1] -%}
                  {%- set day = day_start + timedelta(days=offset) -%}
                  {%- if weekday_names[day.weekday()] in weekdays -%}
                    {%- set start = day + timedelta(hours=sh, minutes=sm, seconds=ss) -%}
                    {%- set end = day + timedelta(hours=eh, minutes=em, seconds=es) -%}
                    {%- if end <= start -%}{%- set end = end + timedelta(days=1) -%}{%- endif -%}
                    {%- set branch = timing.get(kind) -%}
                    {%- set fixed_value = branch.get('time', '') if branch is mapping else branch -%}
                    {%- set raw_minutes = branch.get('minutes') if branch is mapping else branch -%}
                    {%- set valid_minutes = raw_minutes is number and raw_minutes is not boolean
                      and raw_minutes == raw_minutes | int and 1 <= raw_minutes <= 1440 -%}
                    {%- set minutes = raw_minutes | int if valid_minutes else 0 -%}
                    {%- set due = none -%}
                    {%- if kind in ['前一天固定時間', '當天固定時間'] -%}
                      {%- set fp = (fixed_value | string).split(':') -%}
                      {%- set fh = fp[0] | int(-1) if fp | count >= 2 else -1 -%}
                      {%- set fm = fp[1] | int(-1) if fp | count >= 2 else -1 -%}
                      {%- if 0 <= fh <= 23 and 0 <= fm <= 59 -%}
                        {%- set fixed_day = day - timedelta(days=1) if kind == '前一天固定時間' else day -%}
                        {%- set due = fixed_day + timedelta(hours=fh, minutes=fm) -%}
                      {%- endif -%}
                    {%- elif kind == '活動／上課前' and valid_minutes -%}
                      {%- set due = start - timedelta(minutes=minutes) -%}
                    {%- elif kind == '下課前' and valid_minutes -%}
                      {%- set due = end - timedelta(minutes=minutes) -%}
                    {%- elif kind == '下課後' and valid_minutes -%}
                      {%- set due = end + timedelta(minutes=minutes) -%}
                    {%- endif -%}
                    {%- if due is not none -%}
                      {%- set due_minute = (as_timestamp(due) // 60 * 60) | int -%}
                      {%- set key = event.runtime_id ~ '|' ~ day.date() ~ '|' ~ ri ~ '|' ~ due_minute -%}
                      {%- if due_minute == check_minute | int and key not in ns.keys -%}
                        {%- set raw_messages = reminder.get('messages', []) -%}
                        {%- set raw_messages = raw_messages if raw_messages is iterable
                          and raw_messages is not string and raw_messages is not mapping else [] -%}
                        {%- set msgs = namespace(values=[]) -%}
                        {%- for item in raw_messages -%}
                          {%- set value = item.get('message', '') if item is mapping else item -%}
                          {%- if value | string | trim -%}
                            {%- set msgs.values = msgs.values + [value | string | trim] -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- set participant = event.get('participant', '') | string | trim -%}
                        {%- set text = msgs.values | random if msgs.values else
                          ((participant ~ '的') if participant else '') ~ name ~ '提醒時間到了。' -%}
                        {%- set message = text | replace('{event}', name)
                          | replace('{participant}', participant)
                          | replace('{location}', event.get('location', '') | string | trim)
                          | replace('{start_time}', '%02d:%02d' | format(sh, sm))
                          | replace('{end_time}', '%02d:%02d' | format(eh, em))
                          | replace('{minutes}', minutes | string) -%}
                        {%- set ns.keys = ns.keys + [key] -%}
                        {%- set ns.items = ns.items + [{'key': key, 'due_minute': due_minute,
                          'occurrence_date': day.date() | string, 'occurrence_offset': offset,
                          'non_workday_behavior': event.get('non_workday_behavior', 'skip'),
                          'child': event.get('child_name', '') | string | trim,
                          'participant': participant, 'event': name,
                          'child_order': event.get('child_order', 0) | int,
                          'event_order': event.get('event_order', 0) | int,
                          'reminder_order': ri, 'message': message,
                          'sort_key': ('%020d' | format(due_minute)) ~ '|'
                            ~ ('%06d' | format(event.get('child_order', 0) | int)) ~ '|'
                            ~ ('%06d' | format(event.get('event_order', 0) | int)) ~ '|'
                            ~ ('%06d' | format(ri))}] -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
    {%- endfor -%}{{- ns.items | sort(attribute='sort_key') | list -}}
  holiday_source: >-
    {{ holiday_source_input if holiday_source_input in ['calendar', 'workday', 'legacy'] else 'workday' }}
  legacy_compat_fallback: >-
    {{ holiday_source == 'workday' and workday_entity_input | string | trim | length == 0
      and makeup_holiday_entity_input | string | trim | length > 0 }}
  effective_holiday_source: >-
    {{ 'legacy' if legacy_compat_fallback else holiday_source }}
  skip_candidate_count: >-
    {{ raw_candidates | selectattr('non_workday_behavior', 'eq', 'skip') | list | count }}
  calendar_configured: >-
    {{ effective_holiday_source == 'calendar'
      and holiday_calendar_entity_input | string | trim | length > 0 }}
  calendar_query_enabled: >-
    {{ calendar_configured and skip_candidate_count | int > 0
      and states(holiday_calendar_entity_input) not in ['unknown', 'unavailable'] }}
  workday_configured: >-
    {{ effective_holiday_source == 'workday'
      and workday_entity_input | string | trim | length > 0 }}
  workday_query_enabled: >-
    {{ workday_configured and states(workday_entity_input) not in ['unknown', 'unavailable'] }}
  workday_query_offsets: >-
    {{ raw_candidates | selectattr('non_workday_behavior', 'eq', 'skip')
      | map(attribute='occurrence_offset') | unique | sort | list }}
  legacy_holiday_active: >-
    {{ effective_holiday_source == 'legacy'
      and makeup_holiday_entity_input | string | trim | length > 0
      and is_state(makeup_holiday_entity_input, 'on') }}
  calendar_range_start: >-
    {{ (as_local(as_datetime(check_minute | int)).replace(hour=0, minute=0, second=0, microsecond=0)
      - timedelta(days=2)).isoformat() }}
  calendar_range_end: >-
    {{ (as_local(as_datetime(check_minute | int)).replace(hour=0, minute=0, second=0, microsecond=0)
      + timedelta(days=2)).isoformat() }}
  workday_date_minus_2: "{{ (as_local(as_datetime(check_minute | int)).date() - timedelta(days=2)) | string }}"
  workday_date_minus_1: "{{ (as_local(as_datetime(check_minute | int)).date() - timedelta(days=1)) | string }}"
  workday_date_same: "{{ as_local(as_datetime(check_minute | int)).date() | string }}"
  workday_date_plus_1: "{{ (as_local(as_datetime(check_minute | int)).date() + timedelta(days=1)) | string }}"

conditions:
  - condition: template
    value_template: "{{ raw_candidates | count > 0 }}"

actions:
  - alias: Phase A 沒有候選時不查假日來源、不改音量、不播放
    condition: template
    value_template: "{{ raw_candidates | count > 0 }}"
  - alias: 每個 heartbeat 最多查詢一次 Calendar（D-2 00:00 至 D+2 00:00）
    if:
      - condition: template
        value_template: "{{ calendar_query_enabled }}"
    then:
      - action: calendar.get_events
        target: {entity_id: "{{ holiday_calendar_entity_input }}"}
        data:
          start_date_time: "{{ calendar_range_start }}"
          end_date_time: "{{ calendar_range_end }}"
        response_variable: holiday_calendar_response
        continue_on_error: true
  - &workday_minus_2
    alias: 每個候選活動發生日最多查詢一次 Workday（D-2）
    if:
      - condition: template
        value_template: "{{ workday_query_enabled and -2 in workday_query_offsets }}"
    then:
      - action: workday.check_date
        target: {entity_id: "{{ workday_entity_input }}"}
        data: {check_date: "{{ workday_date_minus_2 }}"}
        response_variable: workday_response_minus_2
        continue_on_error: true
  - alias: 每個候選活動發生日最多查詢一次 Workday（D-1）
    if:
      - condition: template
        value_template: "{{ workday_query_enabled and -1 in workday_query_offsets }}"
    then:
      - action: workday.check_date
        target: {entity_id: "{{ workday_entity_input }}"}
        data: {check_date: "{{ workday_date_minus_1 }}"}
        response_variable: workday_response_minus_1
        continue_on_error: true
  - alias: 每個候選活動發生日最多查詢一次 Workday（D）
    if:
      - condition: template
        value_template: "{{ workday_query_enabled and 0 in workday_query_offsets }}"
    then:
      - action: workday.check_date
        target: {entity_id: "{{ workday_entity_input }}"}
        data: {check_date: "{{ workday_date_same }}"}
        response_variable: workday_response_same
        continue_on_error: true
  - alias: 每個候選活動發生日最多查詢一次 Workday（D+1）
    if:
      - condition: template
        value_template: "{{ workday_query_enabled and 1 in workday_query_offsets }}"
    then:
      - action: workday.check_date
        target: {entity_id: "{{ workday_entity_input }}"}
        data: {check_date: "{{ workday_date_plus_1 }}"}
        response_variable: workday_response_plus_1
        continue_on_error: true
  - variables:
      matched_reminders: >-
        {%- set calendar_response = holiday_calendar_response
          if holiday_calendar_response is defined and holiday_calendar_response is mapping else {} -%}
        {%- set calendar_result = calendar_response.get(holiday_calendar_entity_input, {})
          if calendar_response is mapping else {} -%}
        {%- set calendar_events = calendar_result.get('events', [])
          if calendar_result is mapping else [] -%}
        {%- set calendar_events = calendar_events if calendar_events is iterable
          and calendar_events is not string and calendar_events is not mapping else [] -%}
        {%- set holidays = namespace(dates=[]) -%}
        {%- for event in calendar_events if event is mapping -%}
          {%- set summary = event.get('summary', '') | string -%}
          {%- set description = event.get('description', '') | string -%}
          {%- set start = event.get('start', '') | string | trim -%}
          {%- set date_key = start[0:10] -%}
          {%- set parts = date_key.split('-') -%}
          {%- set valid_date = parts | count == 3 and date_key | length == 10
            and parts[0] | int(-1) >= 1 and 1 <= parts[1] | int(-1) <= 12
            and 1 <= parts[2] | int(-1) <= 31 -%}
          {%- set makeup_workday = '補行上班' in summary or '補班' in summary -%}
          {%- set holiday = not makeup_workday and
            ('國定假日' in description or '補假' in summary) -%}
          {%- if valid_date and holiday and date_key not in holidays.dates -%}
            {%- set holidays.dates = holidays.dates + [date_key] -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for item in raw_candidates -%}
          {%- set keep = true -%}
          {%- if item.non_workday_behavior == 'skip' -%}
            {%- if effective_holiday_source == 'calendar' -%}
              {%- if item.occurrence_date in holidays.dates -%}{%- set keep = false -%}{%- endif -%}
            {%- elif effective_holiday_source == 'workday' and workday_configured -%}
              {%- if item.occurrence_offset == -2 -%}
                {%- set response = workday_response_minus_2 if workday_response_minus_2 is defined else {} -%}
              {%- elif item.occurrence_offset == -1 -%}
                {%- set response = workday_response_minus_1 if workday_response_minus_1 is defined else {} -%}
              {%- elif item.occurrence_offset == 0 -%}
                {%- set response = workday_response_same if workday_response_same is defined else {} -%}
              {%- else -%}
                {%- set response = workday_response_plus_1 if workday_response_plus_1 is defined else {} -%}
              {%- endif -%}
              {%- set result = response.get(workday_entity_input, {}) if response is mapping else {} -%}
              {%- if result is mapping and result.get('workday') is boolean -%}
                {%- set keep = result.get('workday') -%}
              {%- endif -%}
            {%- elif effective_holiday_source == 'legacy' and legacy_holiday_active -%}
              {%- set keep = false -%}
            {%- endif -%}
          {%- endif -%}
          {%- if keep -%}{%- set ns.items = ns.items + [item] -%}{%- endif -%}
        {%- endfor -%}{{- ns.items | sort(attribute='sort_key') | list -}}
  - alias: 假日來源篩選後沒有提醒時不碰播放器或 TTS
    condition: template
    value_template: "{{ matched_reminders | count > 0 }}"
  - variables:
      tts_entity_exists: "{{ states[tts_entity_input] is not none }}"
      tts_entity_available: >-
        {{ tts_entity_exists and states(tts_entity_input) != 'unavailable' }}
  - alias: TTS 實體不存在或暫時不可用時安全跳過
    condition: template
    value_template: "{{ tts_entity_available }}"
  - variables:
      player_snapshots: >-
        {% set ns = namespace(items=[]) %}
        {% for player in media_players_input %}
          {% if states(player) not in ['unknown', 'unavailable'] %}
            {% set ns.items = ns.items + [{'entity_id': player,
              'initial_state': states(player),
              'volume': state_attr(player, 'volume_level') if restore_original_volume_input else none}] %}
          {% endif %}
        {% endfor %}{{ ns.items }}
      state_observation_targets: >-
        {% set ns = namespace(items=[]) %}
        {% for player in player_snapshots %}
          {% if player.initial_state not in ['buffering', 'playing'] %}
            {% set ns.items = ns.items + [player.entity_id] %}
          {% endif %}
        {% endfor %}{{ ns.items }}
  - alias: 沒有可用播放器時安全結束
    condition: template
    value_template: "{{ player_snapshots | count > 0 }}"
  - alias: 每台可用播放器只設定一次播報音量
    repeat:
      for_each: "{{ player_snapshots }}"
      sequence:
        - action: media_player.volume_set
          target: {entity_id: "{{ repeat.item.entity_id }}"}
          data: {volume_level: "{{ announcement_volume_input | float(0.75) }}"}
          continue_on_error: true
  - alias: 依序播放本分鐘全部提醒
    repeat:
      for_each: "{{ matched_reminders }}"
      sequence:
        - variables:
            announcement_message: "{{ repeat.item.message | trim }}"
            speech_wait_seconds: >-
              {% set estimate = ((announcement_message | length) / 3) | round(0, 'ceil') | int + 6 %}
              {{ [[estimate, effective_minimum_tts_wait | int(8)] | max,
                effective_maximum_tts_wait | int(120)] | min }}
            player_completion_timeout_seconds: >-
              {{ [(effective_maximum_tts_wait | int(120))
                - (speech_wait_seconds | int(8)), 0] | max }}
        - repeat:
            for_each: "{{ player_snapshots }}"
            sequence:
              - action: media_player.play_media
                target: {entity_id: "{{ repeat.item.entity_id }}"}
                data:
                  media_content_id: >-
                    {{ 'media-source://tts/' ~ tts_entity_input ~ '?message='
                      ~ (announcement_message | urlencode) ~ '&language='
                      ~ (tts_language_input | urlencode) }}
                  media_content_type: music
                  announce: "{{ attempt_media_resume_input }}"
                continue_on_error: true
        - alias: 在估算 guard 期間觀察可辨識的 active playback
          wait_template: >-
            {{ state_observation_targets | select('is_state', 'buffering') | list | count > 0
              or state_observation_targets | select('is_state', 'playing') | list | count > 0 }}
          timeout: {seconds: "{{ speech_wait_seconds }}"}
          continue_on_timeout: true
        - variables:
            active_playback_observed: "{{ wait.completed | bool }}"
            speech_guard_remaining_seconds: >-
              {{ [[wait.remaining | float(0), 0] | max, speech_wait_seconds | float(0)] | min
                if wait.completed else 0 }}
        - alias: 即使 active state 提早出現仍完成整段估算 guard
          delay: {seconds: "{{ speech_guard_remaining_seconds }}"}
        - alias: 觀察到 active playback 時 bounded 等待其完成
          if:
            - condition: template
              value_template: "{{ active_playback_observed }}"
          then:
            - wait_template: >-
                {{ state_observation_targets | select('is_state', 'buffering') | list | count == 0
                  and state_observation_targets | select('is_state', 'playing') | list | count == 0 }}
              timeout: {seconds: "{{ player_completion_timeout_seconds }}"}
              continue_on_timeout: true
  - alias: 全部訊息完成後執行 final post-playback buffering settle guard
    wait_template: >-
      {{ player_snapshots | map(attribute='entity_id')
        | select('is_state', 'buffering') | list | count == 0 }}
    timeout: {seconds: "{{ effective_buffering_timeout | int(10) }}"}
    continue_on_timeout: true
  - alias: 全部訊息後只恢復一次各播放器原始音量
    repeat:
      for_each: "{{ player_snapshots if restore_original_volume_input else [] }}"
      sequence:
        - if:
            - condition: template
              value_template: "{{ repeat.item.volume is number }}"
          then:
            - action: media_player.volume_set
              target: {entity_id: "{{ repeat.item.entity_id }}"}
              data: {volume_level: "{{ repeat.item.volume }}"}
              continue_on_error: true
